"$schema" = 'https://starship.rs/config-schema.json'

format = """
$username\
$hostname\
$directory\
${custom.jj}\
$git_branch\
$git_state\
$git_status\
${env_var.aws_env}\
$cmd_duration\
$line_break\
$python\
$character"""

[directory]
style = "blue"

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[git_branch]
disabled = true
format = "[$branch]($style)"
style = "bright-black"

[git_status]
disabled = true
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](218) ($ahead_behind$stashed)]($style)"
style = "cyan"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"

[git_state]
disabled = true
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"

[python]
format = "[$virtualenv]($style) "
style = "bright-black"
detect_extensions = []
detect_files = []

[custom.jj]
when = true
format = "$output "
ignore_timeout = true
command = "starship-jj starship --ignore-working-copy prompt"

[custom.git_branch]
when = true
command = "jj root >/dev/null 2>&1 || starship module git_branch"
description = "only show git_branch if we're not in a jj repo"
shell = ["/bin/zsh"]

[kubernetes]
disabled = false

[env_var.aws_env]
variable = "AWS_ENVIRONMENT"
default = ""
symbol = "☁️ "
format = " [($symbol $env_value)]($style) "
style = "bold green"
# when = 'test -n "$AWS_ENVIRONMENT" && test "$AWS_ENVIRONMENT" != "uat" && test "$AWS_ENVIRONMENT" != "production"'
